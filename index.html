<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<meta name="format-detection" content="telephone=no">
<title>货运单</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
    min-height: 100vh;
    padding: 16px 10px 32px;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
    background-color: #eef1f6;
    background-image:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(70, 130, 210, .14), transparent 60%),
      linear-gradient(180deg, #f4f6fa 0%, #e8edf4 100%);
    background-attachment: fixed;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(40, 80, 140, .055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(40, 80, 140, .055) 1px, transparent 1px);
    background-size: 24px 24px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%);
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%);
  }

  /* ========== 卡片 ========== */
  .doc {
    max-width: 560px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 14px;
    padding: 22px 22px 16px;
    position: relative;
    z-index: 1;
    border: 1px solid rgba(210, 220, 235, .9);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, .8) inset,
      0 2px 6px rgba(30, 60, 110, .05),
      0 12px 30px rgba(30, 60, 110, .10);
  }

  .doc::before {
    content: "";
    position: absolute;
    top: 0;
    left: 26px;
    right: 26px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #4677c9 30%, #b81c22 70%, transparent);
    border-radius: 2px;
    opacity: .8;
  }

  /* ========== 抬头 ========== */
  .head {
    text-align: center;
    margin-bottom: 12px;
  }

  .head h1 {
    font-size: 16px;
    font-weight: 600;
    color: #1a1a1a;
    margin: 0 0 3px;
    letter-spacing: 4px;
  }

  .head .sub {
    font-size: 10px;
    color: #b0b8c4;
    letter-spacing: 2px;
  }

  /* ========== 单号 ========== */
  .no {
    text-align: center;
    padding: 10px 0 14px;
    border-bottom: 1px solid #f0f3f8;
    margin-bottom: 12px;
  }

  .no .k {
    font-size: 10px;
    color: #b0b8c4;
    letter-spacing: 3px;
    margin-bottom: 6px;
  }

  .no .v {
    font-family: "SF Mono", "Menlo", Consolas, monospace;
    font-size: 21px;
    font-weight: 600;
    color: #1c3a5e;
    letter-spacing: 1.5px;
    line-height: 1.25;
    word-break: break-all;
  }
  .no .v.empty { color: #d0d6de; font-weight: 400; letter-spacing: 4px; }

  /* ========== 路线 ========== */
  .route {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid #f0f3f8;
    margin-bottom: 12px;
  }

  .route .st { flex: 1; min-width: 0; }
  .route .st.right { text-align: right; }

  .route .st .nm {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1.3;
    word-break: break-all;
  }
  .route .st .nm.empty { color: #d0d6de; font-weight: 400; }

  .route .st .lbl {
    font-size: 10px;
    color: #b0b8c4;
    margin-top: 3px;
    letter-spacing: 2px;
  }

  .route .arrow {
    flex-shrink: 0;
    color: #4677c9;
    font-size: 15px;
    line-height: 1;
    padding: 0 4px;
    align-self: flex-start;
    margin-top: 4px;
  }

  /* ========== 日期 ========== */
  .date {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 12px;
    border-bottom: 1px solid #f0f3f8;
    margin-bottom: 12px;
  }
  .date .k {
    font-size: 11px;
    color: #b0b8c4;
    letter-spacing: 2px;
  }
  .date .v {
    font-size: 13px;
    color: #1c3a5e;
    font-weight: 500;
    font-family: "SF Mono", "Menlo", Consolas, monospace;
    letter-spacing: .3px;
  }
  .date .v.empty { color: #d0d6de; font-weight: 400; }

  /* ========== 发货人 / 收货人（纵向排列） ========== */
  .party {
    padding-bottom: 8px;
    border-bottom: 1px solid #f0f3f8;
    margin-bottom: 8px;
  }
  .party:last-of-type {
    border-bottom: none;
    margin-bottom: 0;
  }

  .party-title {
    font-size: 11px;
    color: #4677c9;
    font-weight: 500;
    letter-spacing: 2px;
    margin-bottom: 6px;
    padding-left: 8px;
    position: relative;
  }
  .party-title::before {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 10px;
    background: #4677c9;
    border-radius: 1.5px;
  }

  .field {
    display: flex;
    padding: 4px 0;
    align-items: flex-start;
    line-height: 1.5;
  }

  .field .k {
    width: 68px;
    flex-shrink: 0;
    font-size: 12px;
    color: #99a2b0;
    padding-top: 1px;
  }

  .field .v {
    flex: 1;
    font-size: 13px;
    color: #1a1a1a;
    word-break: break-all;
    min-width: 0;
    font-weight: 500;
  }
  .field .v.empty { color: #d0d6de; font-weight: 400; }

  /* ========== 底部（印章放大） ========== */
  .foot {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid #f0f3f8;
    margin-top: 6px;
    gap: 14px;
    min-height: 86px;      /* 给放大后的印章预留高度 */
  }

  .foot .note {
    font-size: 11px;
    color: #b0b8c4;
    line-height: 1.7;
    letter-spacing: .3px;
    max-width: 60%;
    padding-bottom: 6px;
  }

  .stamp {
    width: 78px;          /* 从 58px 放大到 78px */
    height: 78px;
    flex-shrink: 0;
    transform: rotate(-8deg);
    opacity: .85;
  }

  /* ========== 响应式 ========== */
  @media (max-width: 400px) {
    body { padding: 10px 6px 24px; }
    .doc { padding: 18px 16px 14px; border-radius: 12px; }
    .doc::before { left: 18px; right: 18px; }
    .no .v { font-size: 17px; letter-spacing: 1px; }
    .route .st .nm { font-size: 16px; }
    .field .k { width: 60px; font-size: 11px; }
    .field .v { font-size: 12.5px; }
    .foot { min-height: 76px; }
    .stamp { width: 68px; height: 68px; }
  }
</style>
</head>
<body>

<div class="doc">

  <!-- 抬头 -->
  <div class="head">
    <h1>货运单</h1>
    <div class="sub">FREIGHT WAYBILL</div>
  </div>

  <!-- 单号 -->
  <div class="no">
    <div class="k">运 单 编 号</div>
    <div class="v" id="noText">—</div>
  </div>

  <!-- 路线 -->
  <div class="route">
    <div class="st">
      <div class="nm" id="fromText">—</div>
      <div class="lbl">始发站</div>
    </div>
    <div class="arrow">→</div>
    <div class="st right">
      <div class="nm" id="toText">—</div>
      <div class="lbl">目的地</div>
    </div>
  </div>

  <!-- 日期 -->
  <div class="date">
    <span class="k">运输日期</span>
    <span class="v" id="dateText">—</span>
  </div>

  <!-- 发货人 -->
  <div class="party">
    <div class="party-title">发货人</div>
    <div class="field">
      <div class="k">姓名</div>
      <div class="v" id="senderText">—</div>
    </div>
    <div class="field">
      <div class="k">公司名称</div>
      <div class="v" id="senderCompanyText">—</div>
    </div>
    <div class="field">
      <div class="k">发货地址</div>
      <div class="v" id="senderAddressText">—</div>
    </div>
  </div>

  <!-- 收货人 -->
  <div class="party">
    <div class="party-title">收货人</div>
    <div class="field">
      <div class="k">姓名</div>
      <div class="v" id="receiverText">—</div>
    </div>
    <div class="field">
      <div class="k">公司名称</div>
      <div class="v" id="receiverCompanyText">—</div>
    </div>
    <div class="field">
      <div class="k">收货地址</div>
      <div class="v" id="receiverAddressText">—</div>
    </div>
  </div>

  <!-- 底部 -->
  <div class="foot">
    <div class="note">
      本单据以承运方纸质原件为准<br>
      如有疑问请联系承运方
    </div>
    <svg class="stamp" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="92" fill="none" stroke="#b81c22" stroke-width="3"/>
      <circle cx="100" cy="100" r="85" fill="none" stroke="#b81c22" stroke-width=".8"/>
      <path id="arc" d="M 42,128 A 64,64 0 1,1 158,128" fill="none"/>
      <text font-family="SimSun, Songti SC, serif" font-weight="700" font-size="19" fill="#b81c22">
        <textPath href="#arc" startOffset="50%" text-anchor="middle">货物运输专用章</textPath>
      </text>
      <polygon points="100,76 106,93 124,93 109,104 115,122 100,111 85,122 91,104 76,93 94,93" fill="#b81c22"/>
      <text x="100" y="152" text-anchor="middle" fill="#b81c22" font-family="SimSun, Songti SC, serif" font-weight="700" font-size="13" letter-spacing="2">业务章</text>
    </svg>
  </div>

</div>

<script>
(function() {
  var p = new URLSearchParams(location.search);

  function set(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var v = (val || '').trim();
    if (v) {
      el.textContent = v;
      el.classList.remove('empty');
    } else {
      el.textContent = '—';
      el.classList.add('empty');
    }
  }

  set('noText', p.get('no'));
  set('fromText', p.get('fr'));
  set('toText', p.get('to'));
  set('dateText', p.get('dt'));

  set('senderText', p.get('sd'));
  set('senderCompanyText', p.get('sc'));
  set('senderAddressText', p.get('sa'));

  set('receiverText', p.get('rc'));
  set('receiverCompanyText', p.get('rcc'));
  set('receiverAddressText', p.get('ra'));

  document.title = p.get('no') ? ('货运单 ' + p.get('no')) : '货运单';
})();
</script>
</body>
</html>
